<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Visualization Playground – Geospatial Data Analytics on AWS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        .pg-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            flex: 0 0 calc(100vh - 89px);
            overflow: hidden;
        }
        .pg-controls {
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .pg-controls h2 {
            font-size: 1rem;
            font-weight: 700;
            color: #f0f6fc;
            text-align: left;
            margin-bottom: 0;
        }
        .pg-controls p {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .control-group {
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .control-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
        }
        .style-options {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .style-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.55rem 0.9rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .style-btn:hover { border-color: var(--sky); color: var(--sky); }
        .style-btn.active { border-color: var(--sky); color: #f0f6fc; background: rgba(14,165,233,0.1); }
        .color-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 3px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.15s;
        }
        .color-swatch.active, .color-swatch:hover { border-color: #f0f6fc; }
        .range-input {
            width: 100%;
            accent-color: var(--primary);
        }
        .range-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }
        .map-wrap { position: relative; overflow: hidden; height: 100%; }
        #map { height: 100%; }
        .csv-loading {
            display: none;
            position: absolute;
            top: 12px; right: 12px;
            z-index: 1000;
            background: rgba(8,13,26,0.9);
            border: 1px solid var(--border-mid);
            border-radius: 3px;
            padding: 0.45rem 0.85rem;
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }
        .leaflet-container { background: #0d1117; }
        .leaflet-control-zoom a { background: var(--bg-elevated) !important; color: var(--text) !important; border-color: var(--border) !important; }
        .leaflet-control-zoom a:hover { color: var(--primary) !important; }
        .leaflet-control-attribution { background: rgba(13,14,26,0.8) !important; color: var(--text-muted) !important; }
        .leaflet-control-attribution a { color: var(--text-muted) !important; }
        .leaflet-popup-content-wrapper { background: var(--bg-elevated); color: var(--text); border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .leaflet-popup-tip { background: var(--bg-elevated); }
        .chapter-tag {
            font-size: 0.72rem;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        @media (max-width: 768px) {
            .pg-layout { grid-template-columns: 1fr; grid-template-rows: auto 350px; height: auto; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><a href="../" style="color:inherit;text-decoration:none;">← Geospatial<span style="color:var(--primary)">AWS</span></a></div>
            <div style="color:var(--text-muted);font-size:0.85rem;font-weight:500;">Map Visualization</div>
        </div>
    </nav>

    <div class="pg-layout">
        <aside class="pg-controls">
            <div>
                <div class="chapter-tag">Chapter 5</div>
                <h2>Map Visualization</h2>
                <p style="margin-top:0.4rem;">Customize styles, colors, and interactivity for geospatial layers on AWS-hosted data.</p>
            </div>

            <div class="control-group">
                <label>Base Map Style</label>
                <div class="style-options">
                    <button class="style-btn active" data-style="dark" onclick="setBaseMap('dark', this)">Dark (Esri Canvas)</button>
                    <button class="style-btn" data-style="light" onclick="setBaseMap('light', this)">Light (Esri Canvas)</button>
                    <button class="style-btn" data-style="osm" onclick="setBaseMap('osm', this)">OpenStreetMap</button>
                    <button class="style-btn" data-style="topo" onclick="setBaseMap('topo', this)">Topo (ESRI)</button>
                </div>
            </div>

            <div class="control-group">
                <label>Layer Color</label>
                <div class="color-row" id="colorSwatches">
                    <div class="color-swatch active" style="background:#0ea5e9;" data-color="#0ea5e9" onclick="setColor('#0ea5e9', this)"></div>
                    <div class="color-swatch" style="background:#4fc1e9;" data-color="#4fc1e9" onclick="setColor('#4fc1e9', this)"></div>
                    <div class="color-swatch" style="background:#a2d952;" data-color="#a2d952" onclick="setColor('#a2d952', this)"></div>
                    <div class="color-swatch" style="background:#f4a234;" data-color="#f4a234" onclick="setColor('#f4a234', this)"></div>
                    <div class="color-swatch" style="background:#da68c5;" data-color="#da68c5" onclick="setColor('#da68c5', this)"></div>
                    <div class="color-swatch" style="background:#48cfad;" data-color="#48cfad" onclick="setColor('#48cfad', this)"></div>
                </div>
            </div>

            <div class="control-group">
                <label>Fill Opacity — <span id="opacityVal">0.4</span></label>
                <input type="range" class="range-input" id="opacitySlider" min="0" max="1" step="0.05" value="0.4" oninput="setOpacity(this.value)">
                <div class="range-label"><span>0</span><span>1</span></div>
            </div>

            <div class="control-group">
                <label>Stroke Weight — <span id="weightVal">1.5</span>px</label>
                <input type="range" class="range-input" id="weightSlider" min="0.5" max="5" step="0.5" value="1.5" oninput="setWeight(this.value)">
                <div class="range-label"><span>0.5</span><span>5</span></div>
            </div>

            <div class="control-group">
                <label>Sample Layer</label>
                <div class="style-options">
                    <button class="style-btn active" onclick="loadLayer('states', this)">US States (Census TIGER)</button>
                    <button class="style-btn" onclick="loadLayer('compressor_stations', this)">NG Compressor Stations</button>
                    <button class="style-btn" onclick="loadLayer('wind_turbines', this)">US Wind Turbines (USWTDB)</button>
                    <button class="style-btn" onclick="loadLayer('fuel_stations', this)">EV / Alt-Fuel Stations</button>
                    <button class="style-btn" onclick="loadLayer('co_transmission', this)">CO Transmission Lines</button>
                    <button class="style-btn" onclick="loadLayer('stadiums', this)">Stadiums · 5 leagues</button>
                    <button class="style-btn" onclick="loadLayer('texas_wells', this)">Texas Wells (RRC)</button>
                    <button class="style-btn" onclick="loadLayer('utah_wells', this)">Utah Oil &amp; Gas Wells</button>
                </div>
            </div>
        </aside>

        <div class="map-wrap">
            <div id="map"></div>
            <div id="csv-loading" class="csv-loading">Loading…</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script>
    // ── State ─────────────────────────────────────────────────────────────────
    let currentColor = '#0ea5e9';
    let currentOpacity = 0.4;
    let currentWeight = 1.5;
    let currentLayer = null;
    let currentLayerType = 'states';

    // ── Tile layers ───────────────────────────────────────────────────────────
    // CARTO's free anonymous basemap tiles now require an account/API key (they'll render but
    // plaster "API KEY REQUIRED" across every tile) -- ESRI's Canvas services are the free,
    // keyless equivalent for the same dark/light cartographic style.
    const TILES = {
        dark:  { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', attr: '© Esri' },
        light: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', attr: '© Esri' },
        osm:   { url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', attr: '© OpenStreetMap contributors' },
        topo:  { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', attr: '© Esri' }
    };

    const map = L.map('map').setView([38, -97], 4);
    let tileLayer = L.tileLayer(TILES.dark.url, { attribution: TILES.dark.attr, subdomains: 'abcd', maxZoom: 19 }).addTo(map);

    // ── Generate sample layers ────────────────────────────────────────────────
    function getStyle() {
        return { color: currentColor, fillColor: currentColor, fillOpacity: currentOpacity, weight: currentWeight };
    }

    // ── Real US state boundaries (Census TIGER, via the same S3 mirror US_Counties.geojson
    // uses in the Spatial Processing playground) -- fetched once, held in memory only (at ~13MB
    // it's too big to reliably round-trip through localStorage, unlike the smaller CSV layers below).
    const STATES_URL = 'https://geospatial-on-aws.s3.amazonaws.com/data/Municipal%20Boundaries/US_States.geojson';
    let statesGeoJSON = null;
    async function loadStatesGeoJSON() {
        if (statesGeoJSON) return statesGeoJSON;
        const res = await fetch(STATES_URL);
        statesGeoJSON = await res.json();
        return statesGeoJSON;
    }

    // ── Real energy/utilities infrastructure, from the same local datasets the book ships
    // under data/ but that nothing on the site previously loaded. Point layers share the
    // existing CSV_LAYERS shape (latF/lonF/popupFields/bbox); `sampleTo` uniformly thins a
    // large national file down to a size the map can render smoothly without losing its
    // nationwide spread (first-N would just show whichever state happens to sort first).
    const CSV_LAYERS = {
        stadiums:             { url: '../data/stadiums.csv',                                                        latF: 'Lat',       lonF: 'Long',      limit: null, popupFields: ['Team','League','Division'],                       bbox: [[25,-125],[55,-65]] },
        texas_wells:          { url: 'https://geospatial-on-aws.s3.amazonaws.com/data/Energy/TexasWells.csv',       latF: 'Latitude',  lonF: 'Longitude', limit: 5000, popupFields: ['WellName','Operator','ZoneStatus','County'],     bbox: [[25.8,-106.7],[36.5,-93.5]] },
        utah_wells:           { url: 'https://geospatial-on-aws.s3.amazonaws.com/data/Energy/UtahOilGasWellsMB.csv', latF: 'Latitude', lonF: 'Longitude', limit: 5000, popupFields: ['WellName','Operator','WellStatus','County'],     bbox: [[36.9,-114.1],[42.0,-109.0]] },
        compressor_stations:  { url: '../data/NG_CompressorStations.csv',    latF: 'LATITUDE', lonF: 'LONGITUDE', popupFields: ['NAME','OPERATOR','STATUS','COUNTY','STATE'],      bbox: [[24,-125],[55,-65]] },
        wind_turbines:        { url: '../data/USWindTurbines.csv',           latF: 'ylat',     lonF: 'xlong',     popupFields: ['p_name','t_manu','t_model','t_cap','p_year'],     bbox: [[24,-125],[50,-65]], sampleTo: 3000 },
        fuel_stations:        { url: '../data/ChargeFuelStations.csv',       latF: 'latitude', lonF: 'longitude', popupFields: ['station_name','fuel_type','city','state','ev_network'], bbox: [[19,-166],[65,-65]], sampleTo: 3000 },
    };
    const csvCache = {};

    // Colorado transmission lines ship as an ArcGIS FeatureSet export (paths in EPSG:3857 web
    // mercator meters), not GeoJSON -- convert with the standard closed-form inverse mercator
    // formula rather than pulling in a full projection library for one dataset.
    const CO_TRANSMISSION_URL = '../data/CO_Electric_Transmission_Lines.json';
    let coTransmissionCache = null;
    function webMercatorToLngLat([x, y]) {
        const R = 20037508.34;
        return [x / R * 180, (Math.atan(Math.exp(y / R * Math.PI)) * 2 - Math.PI / 2) * 180 / Math.PI];
    }
    async function loadCoTransmission() {
        if (coTransmissionCache) return coTransmissionCache;
        const res = await fetch(CO_TRANSMISSION_URL);
        const json = await res.json();
        coTransmissionCache = json.features.map(f => f.geometry.paths.map(path => path.map(webMercatorToLngLat)));
        return coTransmissionCache;
    }

    const REMOTE_LAYERS = new Set(['states', 'co_transmission']);

    function loadLayer(type, btn) {
        document.querySelectorAll('.pg-controls .style-btn').forEach(b => {
            if (b.getAttribute('onclick') && b.getAttribute('onclick').includes('loadLayer')) b.classList.remove('active');
        });
        if (btn) btn.classList.add('active');
        currentLayerType = type;
        if (type === 'states') loadStatesLayer();
        else if (type === 'co_transmission') loadTransmissionLayer();
        else loadCSVLayer(type);
    }

    function rebuildLayer() {
        if (currentLayerType === 'states') return loadStatesLayer();
        if (currentLayerType === 'co_transmission') return loadTransmissionLayer();
    }

    async function loadStatesLayer() {
        const loader = document.getElementById('csv-loading');
        loader.style.display = 'block'; loader.textContent = 'Loading…';
        const geojson = await loadStatesGeoJSON();
        loader.style.display = 'none';
        if (currentLayerType !== 'states') return; // user switched layers while this was in flight
        if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null; }
        const style = getStyle();
        currentLayer = L.geoJSON(geojson, {
            style: () => style,
            onEachFeature: (f, layer) => layer.bindPopup(`<b>${f.properties.NAME}</b> (${f.properties.STUSPS})<br>Land area: ${Math.round(f.properties.ALAND / 2589988).toLocaleString()} sq mi`),
        }).addTo(map);
    }

    async function loadTransmissionLayer() {
        const loader = document.getElementById('csv-loading');
        loader.style.display = 'block'; loader.textContent = 'Loading…';
        const paths = await loadCoTransmission();
        loader.style.display = 'none';
        if (currentLayerType !== 'co_transmission') return;
        if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null; }
        const style = getStyle();
        const lines = paths.map(segments => L.polyline(segments.map(seg => seg.map(([lng, lat]) => [lat, lng])), { ...style, fill: false })
            .bindPopup('Colorado electric transmission line segment'));
        currentLayer = L.layerGroup(lines).addTo(map);
        map.fitBounds([[36.9, -109.1], [41.0, -102.0]], { padding: [20, 20] });
    }

    // Uniformly thin a large national CSV down to `sampleTo` rows by fixed stride, so the sample
    // still spans the whole country instead of just however the source file happens to be sorted.
    function sampleRows(rows, sampleTo) {
        if (!sampleTo || rows.length <= sampleTo) return rows;
        const stride = Math.ceil(rows.length / sampleTo);
        return rows.filter((_, i) => i % stride === 0);
    }

    function renderCSVPoints(rows, cfg) {
        if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null; }
        const style = getStyle();
        const markers = [];
        const sampled = sampleRows(rows, cfg.sampleTo);
        const limit = cfg.limit ? Math.min(sampled.length, cfg.limit) : sampled.length;
        for (let i = 0; i < limit; i++) {
            const row = sampled[i];
            const lat = parseFloat(row[cfg.latF]), lon = parseFloat(row[cfg.lonF]);
            if (isNaN(lat) || isNaN(lon)) continue;
            const popup = cfg.popupFields.filter(f => row[f]).map(f => `<div><b>${f}:</b> ${row[f]}</div>`).join('');
            markers.push(
                L.circleMarker([lat, lon], { radius: 4, ...style }).bindPopup(popup || 'No data')
            );
        }
        currentLayer = L.layerGroup(markers).addTo(map);
        if (cfg.bbox) map.fitBounds(cfg.bbox, { padding: [20, 20] });
    }

    async function loadCSVLayer(type) {
        const cfg = CSV_LAYERS[type];
        const loader = document.getElementById('csv-loading');

        if (csvCache[type]) {
            renderCSVPoints(csvCache[type], cfg);
            return;
        }

        loader.style.display = 'block';
        loader.textContent = 'Loading…';
        if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null; }

        Papa.parse(cfg.url, {
            download: true,
            header: true,
            dynamicTyping: false,
            skipEmptyLines: true,
            complete(results) {
                csvCache[type] = results.data;
                loader.style.display = 'none';
                if (currentLayerType === type) renderCSVPoints(results.data, cfg);
            },
            error() {
                loader.textContent = 'Load failed';
                setTimeout(() => { loader.style.display = 'none'; }, 3000);
            }
        });
    }

    // ── Controls ──────────────────────────────────────────────────────────────
    function setBaseMap(key, btn) {
        document.querySelectorAll('[data-style]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        map.removeLayer(tileLayer);
        const t = TILES[key];
        tileLayer = L.tileLayer(t.url, { attribution: t.attr, subdomains: 'abcd', maxZoom: 19 }).addTo(map);
    }

    function redraw() {
        if (REMOTE_LAYERS.has(currentLayerType)) {
            rebuildLayer();
        } else if (csvCache[currentLayerType]) {
            renderCSVPoints(csvCache[currentLayerType], CSV_LAYERS[currentLayerType]);
        }
    }

    function setColor(color, el) {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
        currentColor = color;
        redraw();
    }

    function setOpacity(val) {
        currentOpacity = parseFloat(val);
        document.getElementById('opacityVal').textContent = val;
        redraw();
    }

    function setWeight(val) {
        currentWeight = parseFloat(val);
        document.getElementById('weightVal').textContent = val;
        redraw();
    }

    // Initial load
    rebuildLayer();
    </script>
    <footer class="page-footer">
        <span>&copy; 2026 Bateman &middot; Gnanachandran &middot; DeMuth &mdash; Packt</span>
        <span id="page-updated"></span>
    </footer>
    <script>(function(){var el=document.getElementById('page-updated');if(!el)return;var d=new Date(document.lastModified);if(isNaN(d))return;el.textContent='Updated '+d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});})();</script>
</body>
</html>
